[workspace]
resolver = "2"
members = [
    "crates/slowshell-core",
    "crates/slowshell-win",
    "crates/slowshell-ui",
    "crates/slowshell-runtime",
    "crates/slowshell",
    "crates/shellctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/slowshell/slowshell"
authors = ["Slowshell contributors"]

[workspace.dependencies]
windows-future = "0.3"
slowshell-core = { path = "crates/slowshell-core" }
slowshell-win = { path = "crates/slowshell-win" }
slowshell-ui = { path = "crates/slowshell-ui" }
slowshell-runtime = { path = "crates/slowshell-runtime" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
windows = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# A leaner, faster build profile for local iteration.
[profile.dev]
opt-level = 1
debug = 1
