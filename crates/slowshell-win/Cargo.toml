[package]
name = "slowshell-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows platform layer for Slowshell: monitors, windows, system tray, power, audio, network, input and the Direct2D renderer"

[dependencies]
slowshell-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `Vector2` is used by the Direct2D geometry structs. The `windows` crate does not
# re-export it, so it is named directly.
windows-numerics = "0.3"
windows-future = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Win32",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Notifications",
    "Win32_UI_ColorSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_ProcessStatus",
    "Win32_Storage_EnhancedStorage",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetShell",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaPlayer",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Shutdown",
    "Win32_System_IO",
]

[lib]
name = "slowshell_win"
path = "src/lib.rs"
