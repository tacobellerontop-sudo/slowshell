name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Check every example config
        shell: pwsh
        run: |
          Get-ChildItem examples\*.config | ForEach-Object {
            cargo run -q -p slowshell -- --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  # The language crate has no Windows dependencies, and keeping it that way is
  # a rule (docs/ARCHITECTURE.md). This job is what enforces it.
  core-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p slowshell-core
